<!DOCTYPE html>
<html>
<head>
  <title>luca.love</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      position: relative;
      font-family: Arial, sans-serif;
    }

    img {
      max-width: 90%;
      max-height: 90%;
    }

    .top-buttons {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10;
    }

    .top-buttons button,
    .top-buttons a {
      text-decoration: none;
      color: white;
      font-size: 12px;
      letter-spacing: 2px;
      border: 1px solid white;
      padding: 8px 16px;
      background: transparent;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .top-buttons button:hover,
    .top-buttons a:hover {
      background: white;
      color: black;
    }

    .top-buttons button.active {
      color: #00ffff;
      border-color: #00ffff;
      cursor: default;
      animation: glowExtreme 0.8s infinite alternate;
    }

    .top-buttons button.active:hover {
      background: transparent;
      color: #00ffff;
    }

    @keyframes glowExtreme {
      0% {
        box-shadow:
          0 0 5px #00ffff,
          0 0 10px #00ffff,
          0 0 20px #00ffff;
      }

      100% {
        box-shadow:
          0 0 20px #00ffff,
          0 0 40px #00ffff,
          0 0 80px #00ffff;
      }
    }

    .popup {
      display: none;
      position: absolute;
      top: 120px;
      left: 50%;
      transform: translateX(-50%);
      width: 340px;
      background: rgba(0, 0, 0, 0.96);
      border: 1px solid white;
      padding: 20px;
      z-index: 20;
    }

    .popup input,
    .popup textarea {
      width: 100%;
      margin-bottom: 12px;
      background: black;
      border: 1px solid white;
      color: white;
      padding: 10px;
      font-size: 12px;
      box-sizing: border-box;
      outline: none;
    }

    .popup textarea {
      height: 120px;
      resize: none;
    }

    .popup button {
      width: 100%;
      padding: 10px;
      background: transparent;
      border: 1px solid white;
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .popup button:hover {
      background: white;
      color: black;
    }

    .popup button:disabled {
      cursor: default;
      opacity: 0.7;
    }

    .popup button:disabled:hover {
      background: transparent;
      color: white;
    }

    .spinner {
      display: none;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top: 2px solid white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .success-message {
      display: none;
      color: #00ffff;
      font-size: 12px;
      letter-spacing: 2px;
      text-align: center;
      margin-top: 10px;
    }

  </style>
</head>

<body>

  <img src="luca.gif" alt="luca gif">

  <div class="top-buttons">

    <button id="sound-btn">LEARN MORE</button>

    <a href="https://icp.live/" target="_blank">
      THE VALUE OF LIFE
    </a>

    <button id="email-btn">EMAIL ME</button>

  </div>

  <div class="popup" id="email-popup">

    <input type="text" id="name" placeholder="YOUR NAME">

    <input type="email" id="email" placeholder="YOUR EMAIL">

    <textarea id="message" placeholder="YOUR MESSAGE"></textarea>

    <button id="send-btn">
      <span id="send-text">SEND MESSAGE</span>
      <span class="spinner" id="spinner"></span>
    </button>

    <div class="success-message" id="success-message">
      MESSAGE SENT
    </div>

  </div>

  <audio id="bg-audio" loop>
    <source src="sound.mp3" type="audio/mpeg">
  </audio>

  <script>

    const soundButton = document.getElementById("sound-btn");
    const audio = document.getElementById("bg-audio");

    soundButton.addEventListener("click", function () {
      audio.play();
      soundButton.innerText = "SOUND ON";
      soundButton.classList.add("active");
    });

    const emailButton = document.getElementById("email-btn");
    const popup = document.getElementById("email-popup");

    emailButton.addEventListener("click", function () {
      popup.style.display = popup.style.display === "block" ? "none" : "block";
    });

    const sendButton = document.getElementById("send-btn");
    const sendText = document.getElementById("send-text");
    const spinner = document.getElementById("spinner");

    sendButton.addEventListener("click", async function () {
      const data = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        message: document.getElementById("message").value
      };

      sendButton.disabled = true;
      sendText.innerText = "SENDING...";
      spinner.style.display = "inline-block";

      try {
        await fetch("https://script.google.com/macros/s/AKfycbznMNA5GOcB2OnMdEy-Z1SPDP0y2wROXwlK8eX0DexVmNYzRmmuKIRUH6NnmaCf5xHqZA/exec", {
          method: "POST",
          body: JSON.stringify(data)
        });

        sendText.innerText = "SEND MESSAGE";
        spinner.style.display = "none";
        sendButton.disabled = false;

        document.getElementById("success-message").style.display = "block";

        document.getElementById("name").value = "";
        document.getElementById("email").value = "";
        document.getElementById("message").value = "";

        setTimeout(() => {
          document.getElementById("success-message").style.display = "none";
          popup.style.display = "none";
        }, 2000);

      } catch (error) {
        spinner.style.display = "none";
        sendText.innerText = "SEND MESSAGE";
        sendButton.disabled = false;

        alert("ERROR SENDING MESSAGE");
      }
    });

  </script>

</body>
</html>
