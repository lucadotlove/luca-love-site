<!DOCTYPE html>
<html>
<head>
  <title>luca.love</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      position: relative;
      font-family: Arial, sans-serif;
    }

    img {
      max-width: 90%;
      max-height: 90%;
    }

    .top-buttons {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
    }

    .top-buttons button,
    .top-buttons a {
      text-decoration: none;
      color: white;
      font-size: 12px;
      letter-spacing: 2px;
      border: 1px solid white;
      padding: 8px 16px;
      background: transparent;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .top-buttons button:hover,
    .top-buttons a:hover {
      background: white;
      color: black;
    }

    /* SOUND ACTIVE STATE */
    .top-buttons button.active {
      color: #00ffff;
      border-color: #00ffff;
      cursor: default;
      animation: glowExtreme 0.8s infinite alternate;
    }

    .top-buttons button.active:hover {
      background: transparent;
      color: #00ffff;
    }

    @keyframes glowExtreme {
      0% {
        box-shadow:
          0 0 5px #00ffff,
          0 0 10px #00ffff,
          0 0 20px #00ffff;
      }

      100% {
        box-shadow:
          0 0 20px #00ffff,
          0 0 40px #00ffff,
          0 0 80px #00ffff;
      }
    }
  </style>
</head>
<body>

  <img src="luca.gif" alt="luca gif">

  <div class="top-buttons">

    <!-- SOUND BUTTON -->
    <button id="sound-btn">LEARN MORE</button>

    <!-- LINKEDIN -->
    <a href="https://www.linkedin.com/in/lucaboschin/" target="_blank">
      LINKEDIN
    </a>

    <!-- ICP -->
    <a href="https://icp.live/" target="_blank">
      THE VALUE OF LIFE
    </a>

  </div>

  <audio id="bg-audio" loop>
    <source src="sound.mp3" type="audio/mpeg">
  </audio>

  <script>
    const button = document.getElementById("sound-btn");
    const audio = document.getElementById("bg-audio");

    button.addEventListener("click", function () {
      audio.play();

      button.innerText = "SOUND ON";
      button.classList.add("active");
    });
  </script>

</body>
</html>
